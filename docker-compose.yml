services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  web:
    build: .
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env.docker
    volumes:
      - media_data:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  celery_worker:
    build: .
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env.docker
    volumes:
      - media_data:/app/media
    command: celery -A config worker -l info

  celery_beat:
    build: .
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env.docker
    command: celery -A config beat -l info

volumes:
  postgres_data:
  redis_data:
  media_data:
